name: {{ cookiecutter.project_slug }}

channels: &id1
  - conda-forge

dependencies:
  - python=3.*.*
  - pip

  # test requirements
  - pytest
  - pytest-cov
  - urlchecker

  # lint requirements
  - flake8
  - pycodestyle
  - pydocstyle
  - pylint

  # doc requirements
  - sphinx
  - sphinx-argparse
  - sphinx-autodoc-typehints
  - sphinx_rtd_theme

  # deployment requirements
  - twine

  - pip:
    - pytest-reporter-html1
